}

android {
    namespace 'com.radiohora.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.radiohora.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
